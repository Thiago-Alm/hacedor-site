# Revisa el sitio en cada cambio, antes de que llegue a producción.
#
# Corre en Linux, que distingue mayúsculas en los nombres de archivo: una
# ruta que funciona en Windows y no en el contenedor se cae acá y no en el
# despliegue.
name: Verificación

on:
  push:
    branches: [main]
  pull_request:

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node .github/scripts/check.mjs
